name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 09:00 UTC, April through September only.
    - cron: "0 9 * 4-9 1"
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Retrain even if no new games were fetched"
        type: boolean
        default: false

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  retrain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch games since the last cached date
        id: fetch
        run: python src/fetch_data.py --incremental --no-keep-raw

      - name: Stop if there is no new data
        id: gate
        run: |
          if [ "${{ steps.fetch.outputs.new_rows }}" = "0" ] && [ "${{ inputs.force_retrain }}" != "true" ]; then
            echo "No new games since the last run; nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit new cached data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/game_logs data/raw/team_games data/raw/games data/raw/lineups data/raw/statcast_agg data/raw/manifest.json
          git diff --cached --quiet || git commit -m "data: fetch games through $(jq -r .last_date data/raw/manifest.json)"
          git push

      - name: Build features
        if: steps.gate.outputs.run == 'true'
        run: python src/build_features.py

      - name: Train
        if: steps.gate.outputs.run == 'true'
        run: python src/train.py

      - name: Evaluate and apply quality gate (RF MAE must beat baseline)
        if: steps.gate.outputs.run == 'true'
        run: python src/evaluate.py --gate

      - name: Refresh the patterns report
        if: steps.gate.outputs.run == 'true'
        run: python src/analyze_patterns.py

      - name: Commit metrics and model
        if: steps.gate.outputs.run == 'true'
        run: |
          git add metrics/latest.json models/model.joblib reports/
          git diff --cached --quiet || git commit -m "model: retrain on data through $(jq -r .data_through metrics/latest.json)"
          git push
